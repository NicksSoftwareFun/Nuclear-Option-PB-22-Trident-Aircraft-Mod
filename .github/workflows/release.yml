name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.9)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: zip -r "PB22Trident-${TAG}-src.zip" src unity art
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk 'NR>3 && /^## /{exit} NR>3' CHANGELOG.txt > notes.txt
          PRE=""
          case "$TAG" in v0*) PRE="--prerelease" ;; esac
          gh release create "$TAG" release/PB22Trident.dll "PB22Trident-${TAG}-src.zip" \
            --target "$GITHUB_SHA" --title "PB-22 Trident ${TAG}" --notes-file notes.txt $PRE
